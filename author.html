<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作者主页 - STELLA_磬壑</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex items-center justify-center">

    <!-- 居中的卡片 -->
    <div class="bg-white p-10 rounded-2xl shadow-lg max-w-sm w-full text-center mx-4 border border-gray-100">
        
        <!-- 头像 (使用GitHub接口) -->
        <img src="https://github.com/Qinghe-terminal.png" alt="头像" class="w-32 h-32 rounded-full mx-auto shadow-md border-4 border-white mb-6">
        
        <!-- 名字 -->
        <h1 class="text-2xl font-bold text-gray-800 mb-2">STELLA_磬壑</h1>
        
        <!-- GitHub 链接与提示 -->
        <div class="mb-8">
            <a href="https://github.com/Qinghe-terminal" target="_blank" class="inline-block bg-gray-800 text-white px-6 py-2 rounded-full font-semibold hover:bg-gray-700 transition duration-300">
                前往 GitHub 主页
            </a>
            <p class="text-xs text-gray-500 mt-3">请确保自己具有前往github的网络环境</p>
        </div>
        
        <!-- 灰色小字 -->
        <p class="text-gray-400 text-sm">其实也没什么awa</p>
    </div>

</body>
</html>
